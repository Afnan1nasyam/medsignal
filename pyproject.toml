[project]
name = "medsignal"
version = "0.1.0"
description = "Multi-Source Agentic RAG for Drug Safety Intelligence"
requires-python = ">=3.11"
authors = [{name = "Afnan"}]
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that need external API access (deselect with '-m \"not slow\"')",
]
